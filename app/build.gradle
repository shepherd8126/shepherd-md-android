plugins {
    id 'com.android.application'
}

// Single source of truth for the app version. versionCode is derived so it always
// increases monotonically (Android refuses an update whose versionCode is not higher).
def appVersionName = "1.0.4"
def v = appVersionName.tokenize('.')
def appVersionCode = v[0].toInteger() * 10000 + v[1].toInteger() * 100 + v[2].toInteger()

android {
    namespace 'com.shepherd.md'
    compileSdk 34

    defaultConfig {
        applicationId "com.shepherd.md"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    // Release builds are signed with a STABLE key supplied by CI (base64 secret), so that
    // every update installs over the previous one. Without it we fall back to the debug key
    // (fine for a first local/test build, but such APKs cannot update a release-signed install).
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Aligns every transitive kotlin-stdlib* to one version. Without this, kotlin-stdlib 1.8+
    // collides with the older kotlin-stdlib-jdk7/jdk8 artifacts (duplicate classes at dex time).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
