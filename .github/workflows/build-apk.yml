name: Build Android APK

# Builds the installable, release-signed APK. Trigger from the Actions tab
# (Run workflow) or automatically on every push to main.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The release key must be IDENTICAL for every build, or an update refuses to install
      # over the previous version. It is stored as a base64 repo secret.
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore restored."
          else
            echo "WARNING: no ANDROID_KEYSTORE_BASE64 secret - this APK will be debug-signed and cannot update a release install."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Shepherd-Markdown.apk
          ls -lh out

      # Proves the APK carries the stable release key. If this fingerprint ever changes,
      # updates will refuse to install over existing installs.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort | tail -n 1)
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --print-certs --verbose out/Shepherd-Markdown.apk | tee /tmp/sig.txt
          echo "---"
          grep -i "SHA-256 digest" /tmp/sig.txt || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shepherd-Markdown-apk
          path: out/Shepherd-Markdown.apk
          if-no-files-found: error
